<!DOCTYPE html>
<html lang="pt">
<head>
    <link rel="icon" href="img/ico1.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RG Soluções Técnicas</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            /* Imagem de Fundo com Fallback e Escurecimento */
            background: linear-gradient(rgba(10, 20, 35, 0.75), rgba(10, 20, 35, 0.75)), 
                        url('image.png') no-repeat center center fixed,
                        url('https://images.unsplash.com/photo-1581092160607-ee22621dd758?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
        }

        /* Cartão de Login Translúcido */
        .login-card {
            background: rgba(18, 26, 38, 0.92);
            backdrop-filter: blur(8px);
            padding: 40px 30px;
            border-radius: 16px;
            border: 1px solid rgba(0, 195, 255, 0.4);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 123, 255, 0.2);
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-sizing: border-box;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: none; /* Oculto até verificar a sessão */
        }
        .login-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 195, 255, 0.35);
        }
        .login-card img {
            max-width: 160px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0px 2px 6px rgba(0,0,0,0.5));
        }
        h2 { 
            color: #ffffff; 
            margin-bottom: 25px; 
            font-size: 22px;
            font-weight: 600;
        }

        #error-msg { 
            color: #ff6b6b; 
            margin-top: 15px; 
            font-size: 13px; 
            line-height: 1.4;
        }

        /* Botão Google Exclusivo */
        .btn-google {
            background: #ffffff;
            color: #374151;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background 0.2s, transform 0.1s;
        }
        .btn-google:hover {
            background: #f3f4f6;
            transform: scale(1.02);
        }
        .btn-google:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="login-card" id="loginCard">
        <!-- Logótipo -->
        <img src="img/logo.png" alt="RG Soluções Técnicas">
        
        <h2>Iniciar Sessão</h2>

        <!-- Login Exclusivo via Google -->
        <button type="button" id="btn-google-login" class="btn-google">
            <svg width="20" height="20" viewBox="0 0 18 18">
                <path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.41-1.57-5.13-3.72L.97 13.01C2.45 15.96 5.48 18 9 18z"/>
                <path fill="#FBBC05" d="M3.87 10.8c-.18-.53-.28-1.1-.28-1.8s.1-1.27.28-1.8L.97 4.99C.35 6.22 0 7.57 0 9s.35 2.78.97 4.01l2.9-2.21z"/>
                <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.04.97 4.99l2.9 2.21C4.59 5.05 6.62 3.58 9 3.58z"/>
            </svg>
            Entrar com Google
        </button>

        <div id="error-msg"></div>

        <!-- Assinatura -->
        <div style="margin-top: 30px; font-size: 11px; color: #9ca3af; font-weight: 500;">
            Powered by CS Code Solutions
        </div>
    </div>

    <!-- Registo do Service Worker para PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log("Service Worker registado com sucesso!"))
                    .catch((err) => console.log("Erro ao registar o Service Worker:", err));
            });
        }
    </script>

    <!-- Script de Autenticação Exclusiva com Google -->
    <script type="module">
        import { auth, db } from './js/firebase-config.js?v=3.9';
        import { 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const loginCard = document.getElementById('loginCard');
        const errorMsg = document.getElementById('error-msg');
        const btnGoogle = document.getElementById('btn-google-login');

        // Redireciona direto se já estiver autenticado sem piscar a tela
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'index.html';
            } else {
                loginCard.style.display = 'block';
            }
        });

        // Login com Google (Apenas Contas Autorizadas em "allowed_users")
        btnGoogle.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            errorMsg.textContent = "";

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Valida na coleção "allowed_users"
                const userDocRef = doc(db, "allowed_users", user.email.toLowerCase());
                const userSnap = await getDoc(userDocRef);

                if (!userSnap.exists()) {
                    await signOut(auth);
                    errorMsg.textContent = `Acesso negado: O e-mail (${user.email}) não possui cadastro prévio no sistema.`;
                    return;
                }

                window.location.href = 'index.html';
            } catch (error) {
                console.error("Erro no login com Google:", error);
                if (error.code !== 'auth/popup-closed-by-user') {
                    errorMsg.textContent = "Falha ao autenticar via Google. Tente novamente.";
                }
            }
        });
    </script>
</body>
</html>
