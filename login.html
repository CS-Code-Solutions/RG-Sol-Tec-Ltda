<!DOCTYPE html>
<html lang="pt">
<head>
    <link rel="icon" href="img/ico1.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RG Soluções Técnicas</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        /* Contorno e Destaque no Painel de Login */
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #007bff;
            box-shadow: 0 8px 20px rgba(0, 123, 255, 0.15);
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-sizing: border-box;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .login-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 123, 255, 0.22);
        }
        .login-card img {
            max-width: 150px;
            height: auto;
            margin-bottom: 15px;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #555; }
        input { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.2);
        }
        button { width: 100%; background: #007BFF; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #error-msg { color: red; margin-top: 10px; font-size: 14px; }

        /* Estilos do Divisor e Botão Google */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 18px 0;
            color: #888;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }
        .divider span {
            padding: 0 10px;
        }
        .btn-google {
            background: #ffffff;
            color: #555;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 9px;
            transition: background 0.2s, border-color 0.2s;
        }
        .btn-google:hover {
            background: #f8f9fa;
            border-color: #c1c3c7;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- Logótipo -->
        <img src="img/logo.png" alt="RG Soluções Técnicas">
        
        <h2>Iniciar Sessão</h2>
        <form id="login-form">
            <div class="form-group">
                <label>E-mail:</label>
                <input type="email" id="email" required placeholder="exemplo@email.com">
            </div>
            <div class="form-group">
                <label>Palavra-passe:</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit" id="btn-login">Entrar</button>
        </form>

        <!-- Login Alternativo com Google -->
        <div class="divider">
            <span>OU</span>
        </div>

        <button type="button" id="btn-google-login" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 18 18">
                <path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.41-1.57-5.13-3.72L.97 13.01C2.45 15.96 5.48 18 9 18z"/>
                <path fill="#FBBC05" d="M3.87 10.8c-.18-.53-.28-1.1-.28-1.8s.1-1.27.28-1.8L.97 4.99C.35 6.22 0 7.57 0 9s.35 2.78.97 4.01l2.9-2.21z"/>
                <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.04.97 4.99l2.9 2.21C4.59 5.05 6.62 3.58 9 3.58z"/>
            </svg>
            Entrar com Google
        </button>

        <div id="error-msg"></div>

        <!-- Assinatura -->
        <div style="margin-top: 25px; font-size: 11px; color: #adb5bd; font-weight: 500;">
            Powered by CS Code Solutions
        </div>
    </div>

    <!-- Registo do Service Worker para PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log("Service Worker registado com sucesso!"))
                    .catch((err) => console.log("Erro ao registar o Service Worker:", err));
            });
        }
    </script>

    <!-- Script de Autenticação com Validação de Acesso -->
    <script type="module">
        import { auth, db } from './js/firebase-config.js?v=3.9';
        import { 
            signInWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const btnLogin = document.getElementById('btn-login');
        const btnGoogle = document.getElementById('btn-google-login');

        // Login Tradicional (E-mail e Senha)
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            errorMsg.textContent = "";
            btnLogin.disabled = true;
            btnLogin.textContent = "A entrar...";

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'index.html';
            } catch (error) {
                console.error("Erro no login:", error);
                let msg = "Erro ao entrar. Verifique o e-mail e a palavra-passe.";
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    msg = "E-mail ou palavra-passe incorretos.";
                } else if (error.code === 'auth/too-many-requests') {
                    msg = "Muitas tentativas falhadas. Tente novamente mais tarde.";
                }
                errorMsg.textContent = msg;
                btnLogin.disabled = false;
                btnLogin.textContent = "Entrar";
            }
        });

        // Login com Google (Apenas Contas Pré-Cadastradas no Firestore)
        btnGoogle.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            errorMsg.textContent = "";

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Verifica se a conta possui registo prévio na coleção "allowed_users"
                const userDocRef = doc(db, "allowed_users", user.email.toLowerCase());
                const userSnap = await getDoc(userDocRef);

                if (!userSnap.exists()) {
                    await signOut(auth);
                    errorMsg.textContent = `Acesso negado: O e-mail (${user.email}) não possui cadastro prévio no sistema.`;
                    return;
                }

                window.location.href = 'index.html';
            } catch (error) {
                console.error("Erro no login com Google:", error);
                if (error.code !== 'auth/popup-closed-by-user') {
                    errorMsg.textContent = "Falha ao autenticar via Google. Tente novamente.";
                }
            }
        });
    </script>
</body>
</html>
